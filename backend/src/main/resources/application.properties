spring.application.name=prestamos
# Lee backend/.env (ignorado por git). Se prueban dos rutas por si el IDE arranca desde la raíz del repo.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

server.port=8080

# Desarrollo actual: PostgreSQL local. Las credenciales de cada integrante van en backend/.env.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prestamos_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Seguridad (las usa el Integrante 3)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.seed.admin-password=${ADMIN_PASSWORD:Admin123*}
app.seed.user-password=${USER_PASSWORD:Usuario123*}
