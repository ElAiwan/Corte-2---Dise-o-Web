# Alternativa para quien no tenga PostgreSQL instalado: docker compose up -d (desde backend/)
# Toma DB_PASSWORD del mismo archivo .env que usa Spring Boot.
services:
  postgres:
    image: postgres:16
    container_name: prestamos-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: prestamos_db
    ports:
      - "5432:5432"
    volumes:
      - prestamos_postgres_data:/var/lib/postgresql/data
volumes:
  prestamos_postgres_data:
